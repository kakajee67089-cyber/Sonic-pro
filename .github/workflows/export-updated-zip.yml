name: Export updated source ZIP
on:
  push:
    branches: [main]
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create ZIP
        run: zip -r Sonic-pro-updated.zip . -x '.git/*' '.github/workflows/export-updated-zip.yml'
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Sonic-pro-updated
          path: Sonic-pro-updated.zip
