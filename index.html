<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sync Pro 🎵</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1" rel="stylesheet"/>
<style>
:root { --primary:#ff0080; --secondary:#7928ca; --auth-bg:#03001e; --glass:rgba(255,255,255,.08); --neon:0 0 20px rgba(255,0,128,.4); }
#auth-screen{position:fixed;inset:0;z-index:5000;background:linear-gradient(-45deg,#03001e,#7303c0,#03001e,#ec38bc);background-size:400% 400%;animation:gradientBG 15s ease infinite;display:flex;justify-content:center;align-items:center;overflow-y:auto}
@keyframes gradientBG{0%{background-position:0 50%}50%{background-position:100% 50%}100%{background-position:0 50%}}
.panda-box{width:140px;height:120px;margin:0 auto -20px;position:relative;z-index:20;transition:.5s;animation:float 4s ease-in-out infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.panda-head{width:110px;height:95px;background:#fff;border-radius:50% 50% 48% 48%;border:4px solid #111;margin:0 auto;position:relative;box-shadow:0 10px 25px rgba(0,0,0,.4)}
.ear{width:35px;height:35px;background:#111;border-radius:50%;position:absolute;top:-10px}.ear.l{left:-10px}.ear.r{right:-10px}.eye-patch{width:32px;height:40px;background:#111;border-radius:50%;position:absolute;top:28px;display:flex;align-items:center;justify-content:center}.eye-patch.l{left:18px;transform:rotate(10deg)}.eye-patch.r{right:18px;transform:rotate(-10deg)}.eye-w{width:14px;height:14px;background:#fff;border-radius:50%;position:relative;overflow:hidden}.pupil{width:7px;height:7px;background:#000;border-radius:50%;position:absolute;top:3px;left:3px}.hand{width:40px;height:40px;background:#111;border-radius:50%;position:absolute;bottom:-5px;transition:.6s cubic-bezier(.68,-.55,.265,1.55);opacity:0;transform:translateY(20px);z-index:25}.hand.l{left:15px}.hand.r{right:15px}.is-shy .hand{opacity:1;transform:translateY(-48px)}
.auth-card{width:100%;max-width:400px;padding:50px 30px 30px;background:var(--glass);backdrop-filter:blur(30px);border-radius:40px;border:1px solid rgba(255,255,255,.15);text-align:center;box-shadow:0 30px 60px rgba(0,0,0,.6);position:relative}.auth-card h1{font-family:Poppins,sans-serif;font-weight:800;font-size:38px;background:linear-gradient(to bottom,#fff,#ff0080);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:0}.input-group{position:relative;margin-bottom:18px}.auth-card input{width:100%;padding:16px 16px 16px 50px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:18px;color:#fff;outline:none;transition:.4s}.input-icon{position:absolute;left:18px;top:50%;transform:translateY(-50%);opacity:.7;font-size:18px}.eye-btn{position:absolute;right:18px;top:50%;transform:translateY(-50%);cursor:pointer}.auth-btn{width:100%;padding:16px;border-radius:18px;border:none;font-weight:700;cursor:pointer;transition:.3s;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:10px}.btn-auth-main{background:linear-gradient(45deg,var(--primary),var(--secondary));color:#fff;box-shadow:0 10px 20px rgba(255,0,128,.3)}.btn-auth-ghost{background:rgba(255,255,255,.05);color:#fff;border:1px solid rgba(255,255,255,.1)}.hidden{display:none}
</style></head><body>
<div id="recaptcha-container"></div>
<div id="auth-screen"><div class="auth-wrapper"><div class="panda-box" id="panda"><div class="ear l"></div><div class="ear r"></div><div class="panda-head"><div class="eye-patch l"><div class="eye-w"><div class="pupil"></div></div></div><div class="eye-patch r"><div class="eye-w"><div class="pupil"></div></div></div><div class="blush l" style="width:15px;height:8px;background:#ffb6c1;border-radius:50%;position:absolute;top:68px;left:15px;filter:blur(1px)"></div><div class="blush r" style="width:15px;height:8px;background:#ffb6c1;border-radius:50%;position:absolute;top:68px;right:15px;filter:blur(1px)"></div><div class="nose" style="width:12px;height:8px;background:#111;border-radius:50%;position:absolute;bottom:22px;left:50%;transform:translateX(-50%)"></div></div><div class="hand l"></div><div class="hand r"></div></div>
<div class="auth-card"><h1>Sync Pro</h1><p style="font-size:10px;color:#888;letter-spacing:3px;margin-bottom:25px;text-transform:uppercase">Music • Games • Party</p>
<div id="v-email"><div class="input-group"><span class="input-icon">📧</span><input type="email" id="ae" placeholder="Email Address"></div><div class="input-group"><span class="input-icon">🔒</span><input type="password" id="ap" placeholder="Password" onfocus="setPandaShy(true)" onblur="setPandaShy(false)"><span class="eye-btn" onclick="vPass()">👁️</span></div><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:15px"><label style="color:#888"><input type="checkbox" id="auth-stay"> Stay Active</label><a onclick="showAuthV('v-recover')" style="color:var(--primary);cursor:pointer">Recover Password?</a></div><button class="auth-btn btn-auth-main" onclick="doLogin()">🚀 LOGIN / REGISTER</button></div>
<div id="v-phone" class="hidden"><div class="input-group"><span class="input-icon">📱</span><input type="text" id="auth-phone" placeholder="+91 XXXXX XXXXX"></div><button class="auth-btn btn-auth-main" onclick="sendOtp()">SEND OTP</button></div>
<div id="v-otp" class="hidden"><div class="input-group"><span class="input-icon">🔢</span><input type="text" id="auth-otp" placeholder="Enter 6-digit OTP"></div><button class="auth-btn btn-auth-main" onclick="verifyOtp()">VERIFY & START</button></div>
<div id="v-recover" class="hidden"><div class="input-group"><span class="input-icon">📧</span><input type="email" id="recover-email" placeholder="Recovery Email"></div><button class="auth-btn btn-auth-main" onclick="resetPassword()">SEND RESET LINK</button><a onclick="showAuthV('v-email')" style="color:#aaa;font-size:12px;cursor:pointer">Back to Login</a></div>
<div class="divider" style="margin:20px 0;color:#555;font-size:10px">── OR ──</div><button class="auth-btn btn-auth-ghost" style="background:white;color:black" onclick="googleAuth()"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18"> Google Account</button><button class="auth-btn btn-auth-ghost" id="mode-toggle" onclick="togglePhoneMode()">📱 Phone Login</button><button class="auth-btn btn-auth-ghost" onclick="doGuest()">👤 Continue as Guest</button></div></div></div>
<div id="app" style="display:none"></div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script><script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script><script src="/config.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyAiSZULFt9q9qcilW0o9VEYnsriKYZqRXk4",authDomain:"soni-c9410.firebaseapp.com",databaseURL:"https://soni-c9410-default-rtdb.firebaseio.com",projectId:"soni-c9410",storageBucket:"soni-c9410.firebasestorage.app",messagingSenderId:"933796139968",appId:"1:933796139968:web:90343e6f4752057ea06e25"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.database();const ADMIN_EMAILS=["devanandyt88@gmail.com","devanandyt00@gmail.com","devanandyt22@gmail.com","devanandyt99@gmail.com"];
document.addEventListener('mousemove',e=>{document.querySelectorAll('.pupil').forEach(p=>{const r=p.getBoundingClientRect(),a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2));p.style.transform=`translate(${Math.cos(a)*3}px,${Math.sin(a)*3}px)`})});function setPandaShy(s){document.getElementById('panda').classList.toggle('is-shy',s)}function vPass(){const i=document.getElementById('ap');i.type=i.type==='password'?'text':'password'}function showAuthV(id){['v-email','v-phone','v-otp','v-recover'].forEach(v=>document.getElementById(v).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}function togglePhoneMode(){const e=!document.getElementById('v-email').classList.contains('hidden'),b=document.getElementById('mode-toggle');if(e){showAuthV('v-phone');b.innerText='📧 Email Login'}else{showAuthV('v-email');b.innerText='📱 Phone Login'}}
async function doLogin(){const email=document.getElementById('ae').value.trim(),pass=document.getElementById('ap').value;if(!email||pass.length<6)return alert('Min 6 char Password!');try{await auth.signInWithEmailAndPassword(email,pass)}catch(e){if(e.code==='auth/user-not-found')await auth.createUserWithEmailAndPassword(email,pass);else alert(e.message)}}async function googleAuth(){try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){alert(e.message)}}async function doGuest(){try{await auth.signInAnonymously()}catch(e){alert(e.message)}}let confirmResult;async function sendOtp(){const p=document.getElementById('auth-phone').value;window.recaptchaVerifier=new firebase.auth.RecaptchaVerifier('recaptcha-container',{size:'invisible'});confirmResult=await auth.signInWithPhoneNumber(p,window.recaptchaVerifier);showAuthV('v-otp')}async function verifyOtp(){await confirmResult.confirm(document.getElementById('auth-otp').value)}
auth.onAuthStateChanged(async user=>{if(user){let snap=await db.ref('users/'+user.uid).once('value'),data=snap.val();if(!data){const pUid=Math.floor(1000000000+Math.random()*9000000000).toString();data={uid:user.uid,publicUid:pUid,name:user.displayName||'Player',email:user.email||'',coins:1000,isAdmin:ADMIN_EMAILS.includes(user.email)};await db.ref('users/'+user.uid).set(data);await db.ref('publicUidIndex/'+pUid).set(user.uid)}window.U=data;document.getElementById('auth-screen').style.display='none';document.getElementById('app').style.display='flex';if(typeof enterApp==='function')enterApp()}else{document.getElementById('auth-screen').style.display='flex';document.getElementById('app').style.display='none'}});
</script></body></html>
